<button
  (click)="call ? call() : null"
  [routerLink]="link"
  routerLinkActive = 'bg-blue-300 disabled'
  #rla="routerLinkActive"
  [routerLinkActiveOptions]="{ exact: true }"
  class="text-center transition-all text-[10px]  md:w-40 w-fit md:h-12 text-black font-bold md:text-xl font-[Orbitron] rounded-full border px-2"
  [ngClass]="{
    'bg-white hover:bg-gray-200': !rla.isActive
  }"
>
  <span>{{ title }}</span>
</button>
